spring:
  application:
    name: rag-agent-backend
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:rag_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql
      continue-on-error: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b-instruct}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

rag:
  file-store-dir: ${FILE_STORE_DIR:./data/uploads}
  es-index-name: ${ES_INDEX_NAME:rag_chunks}
  ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  chat-model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b-instruct}
  embedding-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
  embedding:
    dim: ${EMBEDDING_DIM:768}
  chunking:
    rule-max-chars: ${RULE_MAX_CHARS:800}
    llm-enabled: ${LLM_CHUNKING_ENABLED:true}
    llm-max-pieces: 6
    llm-required: ${LLM_CHUNKING_REQUIRED:false}
  retrieval:
    vector-top-k: 10
    bm25-top-k: 10
    hyde-top-k: 10
    rrf-k: 60
    top-n: 3
    rerank-candidates: 12
    confidence-threshold: 0.10
  rerank:
    base-url: ${RERANK_BASE_URL:http://localhost:8000}
  ocr:
    base-url: ${OCR_BASE_URL:}
  es:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:*}

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: info
    com.rag.kb: info
